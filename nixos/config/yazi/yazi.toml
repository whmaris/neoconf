[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 5
mouse = true
title_format = "Yazi: {cwd}"

[preview]
wrap = "no"
tab_size = 2
max_width = 1000
max_height = 1000
cache_dir = ""

[opener]
edit = [
  { run = 'nvim %s', block = true, desc = "Neovim", for = "unix" }
]
open = [
  { run = 'xdg-open %s', desc = "Open", for = "linux" }
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/x-shellscript", use = "edit" },
  { url = "*.nix", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.md", use = "edit" },
  { url = "*", use = "open" }
]
