config_version = 16

[accessibility]
ui_scale = 1.2

[bar.default]
background_opacity = 0.5
start = ["launcher", "workspaces"]
center = ["group:g1"]
end = [
  "clipboard",
  "volume",
  "brightness",
  "battery",
  "control-center",
  "tray",
  "notifications",
  "network",
  "bluetooth",
  "clock",
  "session",
]
margin_ends = 0
padding = 10
radius = 0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g1"
members = ["media", "audio_visualizer"]
opacity = 1.0
padding = 6.0

[control_center]
width = 680

[desktop_widgets]
schema_version = 2
widget_order = ["desktop-widget-0000000000000002"]

[desktop_widgets.grid]
